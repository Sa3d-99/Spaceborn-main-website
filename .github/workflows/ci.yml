name: Spaceborn CI/CD

on:
  push:
    branches: [main, redesign/trial-1]
  pull_request:
    branches: [main, redesign/trial-1]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: spaceborn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high

      - name: Build production image
        env:
          NEXT_PUBLIC_LAUNCHES_JSON_URL: ${{ vars.NEXT_PUBLIC_LAUNCHES_JSON_URL }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_LAUNCHES_JSON_URL \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "spaceborn:$GITHUB_SHA" .

      - name: Smoke-test the running image
        run: |
          set -euo pipefail
          container="$(docker run -d -p 127.0.0.1:3000:3000 "spaceborn:$GITHUB_SHA")"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --max-time 3 \
            --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/ > /tmp/spaceborn-home.html
          grep -q '<main' /tmp/spaceborn-home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/company/about > /tmp/spaceborn-about.html
          grep -q '<h1' /tmp/spaceborn-about.html
          status="$(curl --fail --silent --show-error --range 0-127 --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:3000/media/home/hero-sb1.mp4)"
          test "$status" = 206
          test "$(docker exec "$container" id -u)" != 0

      - name: Save the verified image
        if: github.event_name == 'push'
        run: docker image save "spaceborn:$GITHUB_SHA" | gzip -1 > spaceborn-image.tar.gz

      - name: Upload the verified image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spaceborn-image
          path: spaceborn-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to GitHub Container Registry
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spaceborn-image

      - name: Push the image by commit SHA
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker load --input spaceborn-image.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker tag "spaceborn:$GITHUB_SHA" "$image"
          docker push "$image"
          printf 'Published `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
